name: Deploy to Cloudflare Workers

# POR QUE ESTE WORKFLOW EXISTE
#
# Até a fundação da fase bcb (10/08/2026) o deploy do worker era manual, e o
# resultado foi uma deriva medida: o npm estava em 1.3.5 e o endpoint hospedado
# em 1.3.1 — servindo descrições de tool de ~100 caracteres onde o fonte já
# tinha ~1.200 (o trabalho de descrições da v1.3.3 nunca chegou à produção).
# Ver baselines/README.md. Deploy contínuo é a correção estrutural disso.
#
# Dois gatilhos:
# - push em main (nos caminhos que afetam o worker): mantém o endpoint em
#   lockstep com o pacote publicado;
# - workflow_dispatch: redeploy manual sem mudança de código.
#
# Secrets necessários no GitHub:
#   CLOUDFLARE_API_TOKEN  — token com permissão "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID — conta em que o worker é publicado

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Enquanto o CLOUDFLARE_API_TOKEN não estiver cadastrado nos secrets do
      # repositório, o deploy é PULADO em vez de falhar: um main vermelho por
      # credencial ausente esconde falhas de verdade. O deploy segue possível
      # manualmente (`cd worker && npx wrangler deploy` com login local).
      - name: Verificar credencial da Cloudflare
        id: cf
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "::warning::CLOUDFLARE_API_TOKEN ausente — deploy pulado. Cadastre o secret para ligar o deploy contínuo."
          fi

      - if: steps.cf.outputs.ok == 'true'
        uses: actions/checkout@v4

      - if: steps.cf.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # O worker importa ../../dist/*.js do pacote pai e resolve o SDK do
      # node_modules da raiz (cópia única) — a raiz vem primeiro.
      - if: steps.cf.outputs.ok == 'true'
        name: Install + typecheck + build (raiz)
        run: |
          npm ci
          npm run typecheck
          npm run build

      - if: steps.cf.outputs.ok == 'true'
        name: Install (worker)
        run: npm ci
        working-directory: worker

      - if: steps.cf.outputs.ok == 'true'
        name: Typecheck (worker)
        run: npm run typecheck
        working-directory: worker

      - if: steps.cf.outputs.ok == 'true'
        name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker

      # Fecha o ciclo: se o deploy subir um worker quebrado, o job falha aqui e
      # não em silêncio na próxima vez que alguém abrir o endpoint.
      - if: steps.cf.outputs.ok == 'true'
        name: Smoke em produção
        run: |
          sleep 20
          node scripts/smoke-mcp.mjs
