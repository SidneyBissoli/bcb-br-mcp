name: Integration tests (live BCB APIs)

# Contrato de vitalidade/cadência do catálogo curado contra a API real do
# SGS (src/sgs-contract.integration.test.ts): cada série de SERIES_POPULARES
# precisa estar viva e publicando na cadência declarada. Série descontinuada
# não dá erro — congela em silêncio (na ativação, 2026-08, pegou 4 séries da
# FGV mortas desde 2025). Cron semanal, não gateia PRs; a falha deve virar
# pendência no painel do portfolio-monitor (workflow_watch).

on:
  # segunda 08:00 UTC = 05:00 BRT, antes da rodada semanal do monitor (09:00 BRT)
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    # Teto de parede. O alvo de um destes contratos pode parar de responder
    # sem fechar a conexão — descarte silencioso em firewall, medido no
    # senado-br-mcp em 12/09/2026 — e aí cada requisição só morre no timeout
    # dela, o job nunca falha sozinho e vai até as 6 h padrão do GitHub.
    # Rodada real aqui leva no máximo ~2,5 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: SGS catalog contract against live BCB API
        env:
          INTEGRATION_TESTS: '1'
        run: npx vitest run src/sgs-contract.integration.test.ts
